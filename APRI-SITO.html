/* SiliniTax palette and simplified navigation */
:root{--navy:#0B1F45;--blue:#2F66FF;--blue-deep:#173A79;--cream:#FFFFFF;--ink:#0B1F45;--muted:#173A79;--line:#DCE7F5;--yellow:#8FAEFF;--white:#FFFFFF}
body{background:#FFFFFF}
.site-header{background:#0B1F45}
.header-inner{display:grid;grid-template-columns:1fr auto 1fr;gap:24px}
.header-inner>.logo{justify-self:start}
.logo{gap:0;color:#FFFFFF}
.logo strong{color:#8FAEFF}
.nav{height:auto;justify-self:center;display:flex;align-items:center;gap:3px;padding:5px;background:#173A79;border:1px solid rgba(234,241,255,.18);border-radius:999px}
.nav a{display:block;padding:11px 22px;border-radius:999px;color:#EAF1FF;line-height:1;font-weight:700;white-space:nowrap}
.nav a[aria-current]{color:#FFFFFF;background:#2F66FF}
.nav a[aria-current]:after{display:none}
.nav a:hover{color:#FFFFFF;background:rgba(143,174,255,.22)}
.nav a[aria-current]:hover{background:#2F66FF}
.header-right{justify-self:end}
.nav-contact{border:0;border-radius:999px;background:linear-gradient(110deg,#2F66FF,#6D4CFF);color:#FFFFFF;padding:13px 23px;font-size:14px;font-weight:800;box-shadow:0 8px 22px rgba(11,31,69,.18)}
.nav-contact:hover{background:#2F66FF}
.button{justify-content:center;gap:0;min-height:56px;padding:15px 25px;border:0;border-radius:999px;background:linear-gradient(110deg,#2F66FF,#6D4CFF);color:#FFFFFF;box-shadow:0 10px 24px rgba(23,58,121,.16)}
.button:hover{box-shadow:0 13px 27px rgba(23,58,121,.23)}
.button-light{background:#FFFFFF;color:#0B1F45;border:1px solid #DCE7F5;box-shadow:none}
.button-light:hover{background:#EAF1FF}
.quiet-link,.text-link{gap:0;text-decoration:none}
.hero-inner{min-height:calc(100svh - 90px)}
.hero h1 em,.closing h2 em{color:#8FAEFF}
.hero-copy>p{color:#EAF1FF}
.kicker{color:#8FAEFF}
.kicker-line{background:#8FAEFF}
.hero-art{isolation:isolate}
.orbit{border-color:rgba(143,174,255,.25)}
.experience{background:#FFFFFF}
.human-section{background:linear-gradient(135deg,#EAF1FF,#F1EEFF)}
.human-grid p{color:#173A79}
.closing{background:linear-gradient(120deg,#0B1F45,#173A79)}
.closing p{color:#EAF1FF}
.inner-cta{background:#EAF1FF}
.inner-hero .button,.inner-cta .button{background:linear-gradient(110deg,#2F66FF,#6D4CFF);color:#FFFFFF}
.plan.featured{background:#173A79;border-color:#173A79}
.plan.featured .button{background:#FFFFFF;color:#0B1F45}
.plan.featured p{color:#EAF1FF}
.main-card{background:linear-gradient(145deg,#2F66FF,#173A79)}
.ring{background:conic-gradient(#8FAEFF 0 74%,rgba(255,255,255,.26) 74%)}
.ring>div{background:#2F66FF}
.forecast-line i:last-child{background:#6D4CFF}
.reserve-track i{background:#2F66FF}
.screen,.hero-screen{background:#EEF5FF}
.screen-heading h3,.screen-top{color:#0B1F45}
.step-progress{display:none}
@media(max-width:760px){
  .header-inner{grid-template-columns:1fr auto;height:72px;gap:12px}
  .nav{display:none;position:absolute;top:72px;left:20px;right:20px;width:auto;height:auto;padding:8px;background:#173A79;border:1px solid rgba(234,241,255,.2);border-radius:20px;box-shadow:0 18px 30px rgba(11,31,69,.25)}
  .nav.open{display:flex;flex-direction:column;align-items:stretch;gap:3px}
  .nav a{padding:13px 18px;border:0;border-radius:14px}
  .nav a[aria-current]:after{display:none}
  .nav-contact{padding:10px 16px;font-size:12px}

  .hero-inner{min-height:0}
  .sticky-column{background:linear-gradient(#FFFFFF 83%,rgba(255,255,255,0))}
}
@media(max-width:420px){.nav-contact{display:inline-flex;padding:9px 13px;font-size:11px}.logo{font-size:21px}.header-right{gap:8px}.menu-button{width:28px}.menu-button span{width:22px}}

/* Brand adaptation of the supplied glow button, used only for the two named CTAs. */
.glow-button-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;isolation:isolate;border-radius:999px}
.glow-button-halo{position:absolute;inset:-3px;z-index:-1;border-radius:inherit;background:linear-gradient(105deg,#2F66FF 0%,#6D4CFF 53%,#8FAEFF 100%);filter:blur(12px);opacity:.65;transition:opacity 1s ease,filter .25s ease;pointer-events:none}
.glow-button-wrap:hover .glow-button-halo,.glow-button-wrap:focus-within .glow-button-halo{opacity:1;filter:blur(15px);transition-duration:.2s}
.glow-button{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:15px 25px;border-radius:999px;background:#0B1F45;color:#FFFFFF;font-size:14px;font-weight:800;white-space:nowrap;box-shadow:0 8px 22px rgba(11,31,69,.24);transition:background .2s ease,box-shadow .2s ease,transform .2s ease}
.glow-button:hover,.glow-button:focus-visible{background:#173A79;transform:translateY(-2px);box-shadow:0 12px 28px rgba(11,31,69,.34)}
.glow-button-arrow{width:11px;height:11px;margin-top:1px;stroke:#FFFFFF;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.glow-button-arrow .arrow-shaft{opacity:0;transition:opacity .2s ease}
.glow-button-arrow .arrow-head{transition:transform .2s ease}
.glow-button:hover .arrow-shaft,.glow-button:focus-visible .arrow-shaft{opacity:1}
.glow-button:hover .arrow-head,.glow-button:focus-visible .arrow-head{transform:translateX(3px)}
.header-glow-button .glow-button{min-height:43px;padding:11px 23px}
@media(max-width:760px){.header-glow-button .glow-button{min-height:38px;padding:9px 16px;font-size:12px}}
@media(max-width:420px){.header-glow-button .glow-button{min-height:35px;padding:8px 12px;font-size:11px}.header-glow-button .glow-button-arrow{width:9px;height:9px}.hero-glow-button,.hero-glow-button .glow-button{width:100%}}
@media(prefers-reduced-motion:reduce){.glow-button,.glow-button-halo,.glow-button-arrow path{transition:none!important}.glow-button:hover,.glow-button:focus-visible,.glow-button:hover .arrow-head,.glow-button:focus-visible .arrow-head{transform:none}}

/* Mobile hero: editorial type and the phone share one layered composition. */
.mobile-break{display:none}
@media(max-width:600px){
  .hero{min-height:790px;background:radial-gradient(ellipse at 88% 45%,#123669 0%,#0B2853 42%,#0B1F45 78%)}
  .hero-inner{position:relative;display:block;min-height:790px;padding-top:36px;padding-bottom:126px}
  .hero-copy{position:relative;z-index:2;max-width:none}

  .hero .kicker-line{width:27px;flex:none}
  .hero h1{font-size:clamp(52px,13.9vw,64px);line-height:1;letter-spacing:-.065em;max-width:360px}
  .mobile-break{display:initial}
  .hero-copy>p{max-width:225px;margin-top:20px;font-size:16px;line-height:1.57}
  .hero-actions{display:flex;align-items:flex-start;flex-direction:column;gap:16px;margin-top:30px}
  .hero-glow-button,.hero-glow-button .glow-button{width:min(270px,100%)}
  .hero-glow-button .glow-button{min-height:55px}
  .hero .quiet-link{font-size:15px;padding-bottom:8px}
  .hero-art{position:absolute;z-index:1;top:82px;right:-230px;width:440px;height:520px;min-height:0;margin:0;pointer-events:none;perspective:900px}
  .hero-art .orbit-one{width:445px;height:310px}
  .hero-art .orbit-two{width:565px;height:425px}
  .hero-phone{width:250px;height:508px;transform:scale(.9) rotateY(-16deg) rotateZ(9deg);filter:blur(.35px) drop-shadow(20px 30px 30px rgba(11,31,69,.65));opacity:.78;mask-image:linear-gradient(90deg,transparent,rgba(0,0,0,.85) 25%,#000 45%);-webkit-mask-image:linear-gradient(90deg,transparent,rgba(0,0,0,.85) 25%,#000 45%)}
  .hero-screen{padding:39px 16px 25px}
  .hero-screen .screen-heading h3{font-size:23px}
  .hero-screen .main-card{margin-top:21px}
  .hero-screen .ring{width:112px;height:112px;margin:16px auto}
  .hero-screen .ring>div{width:89px;height:89px}
  .header-inner .logo{font-size:25px}
  .header-glow-button .glow-button{min-height:39px;padding:9px 14px;font-size:12px}
  .menu-button{width:29px}
}
@media(max-width:360px){
  .hero h1{font-size:51px}
  .hero-copy>p{max-width:210px;font-size:15px}
  .hero-art{right:-270px}
  .hero .kicker{font-size:9px;letter-spacing:.13em}
  .header-inner .logo{font-size:22px}
  .header-glow-button .glow-button{padding-inline:11px;font-size:11px}
}

/* The same phone travels from the hero into the feature story. */
.journey-phone-layer{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.journey-phone-layer[hidden]{display:none}
.journey-phone.phone{position:absolute;width:302px;height:612px;max-height:none;transform-origin:center center;transition:none;filter:drop-shadow(20px 26px 26px rgba(11,31,69,.3));will-change:left,top,transform}
.has-scroll-journey .hero-phone{visibility:hidden}
.has-scroll-journey .hero-copy{opacity:calc(1 - var(--hero-exit, 0));transform:translateX(calc(var(--hero-exit, 0) * -65vw));will-change:transform,opacity}
.has-scroll-journey .experience-intro,.has-scroll-journey .sticky-column{display:none}
.has-scroll-journey .story-layout{display:block}
.has-scroll-journey .story-step{min-height:100svh;position:relative;z-index:2;border-color:#DCE7F5}
.has-scroll-journey .story-step .step-content{width:min(35%,420px);max-width:420px;opacity:0;transform:translateX(-70px);transition:opacity .5s ease,transform .65s cubic-bezier(.2,.8,.2,1)}
.has-scroll-journey .story-step:nth-child(even) .step-content{margin-left:auto;transform:translateX(70px)}
.has-scroll-journey .story-step.is-current .step-content{opacity:1;transform:translateX(0)}

  .journey-phone .screen{width:auto;height:auto;inset:0;padding:39px 17px 26px;transform:translateX(18px);border-radius:39px}
  .journey-phone .screen.active{transform:none}
  .journey-phone .side-left{left:-12px;top:140px;height:68px}

  .has-scroll-journey .story-step{display:block;min-height:100svh;scroll-margin-top:0}
  .has-scroll-journey .story-step .step-content,.has-scroll-journey .story-step:nth-child(even) .step-content{position:sticky;top:58svh;width:100%;max-width:440px;margin-left:0;padding:0 0 5svh;opacity:0;transform:translateX(-45px)}
  .has-scroll-journey .story-step.is-current .step-content{opacity:1;transform:translateX(0)}

.journey-title-mobile,.journey-description-mobile{display:none}
.journey-anchor{position:absolute;top:100svh;left:0;width:1px;height:1px;scroll-margin-top:var(--hero-header-height)}
@media(max-width:1000px) and (min-width:761px){
  .hero-journey .journey-card{width:28%;padding:16px;min-height:175px}
  .hero-journey .journey-card p{font-size:13px}
}
@media(max-width:760px){
  body[data-page="home"]{--hero-header-height:72px}
  .hero-journey .hero-inner{height:calc(100svh - var(--hero-header-height));min-height:0;padding:0}
  .hero-journey .hero-copy{left:0;right:0;top:36px;width:100%;max-width:none;transform:translateX(calc(var(--intro-progress,0) * -110vw))}
  .hero-journey h1{font-size:clamp(52px,13.9vw,64px)}
  .hero-journey .hero-art{inset:0;width:100%;height:100%;min-height:0}
  .hero-journey .journey-phone.phone{width:302px;height:612px;max-height:none}
  .hero-journey .journey-phone .phone-body{border-width:9px;border-radius:48px}
  .hero-journey .journey-phone .phone-screen{border-radius:39px}
  .hero-journey .journey-phone .phone-island{width:90px;height:24px;top:8px}
  .hero-journey .journey-phone .home-indicator{bottom:12px;width:86px;height:4px}
  .hero-journey .journey-phone .screen{width:auto;height:auto;inset:0;padding:39px 17px 26px;transform:translateX(18px);border-radius:39px}
  .hero-journey .journey-phone .screen.active{transform:none}
  .hero-journey .journey-phone .side-left{left:-12px;top:140px;height:68px}
  .hero-journey .journey-phone .side-right{right:-13px;top:178px;height:86px}
  .hero-journey .journey-content h2{top:5%;font-size:clamp(34px,8vw,48px)}
  .hero-journey .journey-card{top:auto!important;bottom:2.5%!important;left:0!important;right:0!important;width:100%;min-height:0;max-height:34%;padding:17px 19px;border-radius:20px;visibility:hidden}
  .hero-journey .journey-card.is-current{opacity:1;visibility:visible;transform:translateX(0)}
  .hero-journey .journey-card h3{font-size:21px}
  .hero-journey .journey-card p{font-size:13px;line-height:1.4}
}
@media(prefers-reduced-motion:reduce){
  .hero-journey .journey-content h2,.hero-journey .journey-card{transition:none!important}
}

/* The four side notes keep the desktop composition on narrow phones. */
@media(max-width:600px){
  .journey-title-desktop,.journey-description-desktop{display:none}
  .journey-title-mobile,.journey-description-mobile{display:block}
  .hero-journey .journey-content h2{top:5%;font-size:clamp(30px,8vw,39px)}
  .hero-journey .journey-card{width:calc((100% - 154px)/2);min-height:0;max-height:none;padding:10px 8px 11px;border-radius:15px;visibility:visible;opacity:0;box-shadow:0 8px 24px rgba(3,17,39,.16)}
  .hero-journey .journey-card:nth-child(odd){left:0!important;right:auto!important;transform:translateX(-38px)}
  .hero-journey .journey-card:nth-child(even){left:auto!important;right:0!important;transform:translateX(38px)}
  .hero-journey .journey-card:nth-child(-n+2){top:27%!important;bottom:auto!important}
  .hero-journey .journey-card:nth-child(n+3){top:auto!important;bottom:16%!important}
  .hero-journey .journey-card.is-visible{opacity:1;transform:translateX(0)}
  .hero-journey .journey-card.is-current{border-color:rgba(143,174,255,.65);background:linear-gradient(145deg,rgba(47,102,255,.26),rgba(23,58,121,.48))}
  .hero-journey .journey-card>span{margin-bottom:8px;font-size:8px;letter-spacing:.1em}
  .hero-journey .journey-card h3{font-size:clamp(12px,3.4vw,15px);line-height:1.2;letter-spacing:-.035em}
  .hero-journey .journey-card p{margin-top:7px;font-size:clamp(10px,2.75vw,12px);line-height:1.28}
}
@media(max-width:360px){
  .hero-journey .journey-card{width:83px;padding:8px 6px}
  .hero-journey .journey-card:nth-child(odd){left:-5px!important}
  .hero-journey .journey-card:nth-child(even){right:-5px!important}
  .hero-journey .journey-card p{font-size:10px}
}

/* Each scroll step presents one app screen with its own heading. */
.hero-journey .journey-scene{position:absolute;top:4%;left:50%;width:min(1020px,100%);padding:0 18px;text-align:center;color:#FFFFFF;opacity:0;visibility:hidden;transform:translate(-50%,24px);transition:opacity .45s ease,transform .55s ease,visibility .45s}
.hero-journey .journey-scene.is-current{opacity:1;visibility:visible;transform:translate(-50%,0)}
.journey-scene-label{display:block;margin-bottom:13px;color:#8FAEFF;font-size:11px;font-weight:800;letter-spacing:.2em}
.hero-journey .journey-scene h2{position:static;top:auto;left:auto;right:auto;margin:0;text-align:center;font-size:clamp(38px,4.2vw,56px);line-height:1.07;color:#FFFFFF;opacity:1;transform:none;transition:none}
.hero-journey .journey-scene p{max-width:620px;margin:18px auto 0;color:#DCE7FF;font-size:clamp(16px,1.4vw,19px);line-height:1.45}
@media(max-width:760px){
  .hero-journey .journey-scene{top:4%;width:100%;padding:0 14px}
  .journey-scene-label{margin-bottom:10px;font-size:10px}
  .hero-journey .journey-scene h2{font-size:clamp(31px,8.1vw,44px);line-height:1.08}
  .hero-journey .journey-scene p{max-width:470px;margin-top:12px;font-size:15px;line-height:1.38}
}
@media(max-width:360px){
  .hero-journey .journey-scene{top:3%}
  .hero-journey .journey-scene h2{font-size:29px}
  .hero-journey .journey-scene p{font-size:13px;line-height:1.32;margin-top:9px}
}
@media(max-width:600px) and (max-height:700px){
  .hero-journey .journey-scene{top:2%}
  .hero-journey .journey-scene h2{font-size:29px}
  .hero-journey .journey-scene p{font-size:13px;line-height:1.3;margin-top:9px}
}
@media(prefers-reduced-motion:reduce){
  .hero-journey .journey-scene{transition:none}
}

/* The enlarged screen keeps the original bezel and Dynamic Island. */
.hero-journey.journey-started .journey-phone.phone{filter:drop-shadow(0 18px 32px rgba(4,18,43,.45));transform-style:flat}
.hero-journey.journey-started .journey-phone .phone-edge,
.hero-journey.journey-started .journey-phone .phone-side{display:none}
.hero-journey.journey-started .journey-phone .phone-body{border:9px solid #0B1F45;border-radius:48px;background:#0B1F45;box-shadow:inset 0 0 0 2px #8FAEFF,0 0 0 2px #173A79}
.hero-journey.journey-started .journey-phone .phone-screen{border-radius:39px}
.hero-journey.journey-started .journey-phone .screen{padding-top:39px}
@media(max-width:760px){.hero-journey .hero-inner{overflow:visible}}

/* Home: liquid background instead of the blue grid stage and the coin/receipt photo.
   The page sits on one fixed WebGL canvas; .dark (set while the studio or product chapter is centred)
   turns both the canvas and every text token navy-dark, so headings stay readable during the change. */
body[data-page=home]{--fx-ink:#101010;--fx-ink-2:#3a3a41;--fx-ink-3:#56565d;--fx-hair:rgba(16,16,16,.1);--fx-glass:rgba(255,255,255,.62);background:#eef3fb;color:var(--fx-ink);transition:color .6s cubic-bezier(.22,1,.36,1)}
body[data-page=home].dark{--fx-ink:#f5f5f7;--fx-ink-2:#d2d2d7;--fx-ink-3:#a1a1a6;--fx-hair:rgba(255,255,255,.14);--fx-glass:rgba(22,27,46,.55)}
body[data-page=home].no-fluid{background:linear-gradient(160deg,#eef3fb,#dbe7ff 60%,#efe8ff) fixed}
body[data-page=home].no-fluid.dark{background:#070d22}
#fluid{position:fixed;inset:0;width:100%;height:100%;z-index:-1;display:block;pointer-events:none}
::selection{background:#245eea;color:#fff}

/* surfaces become transparent so the liquid shows through */
body[data-page=home] :is(.ledger-intro,.ledger-journey,.ledger-about,.ledger-platform,.ledger-product,.ledger-capabilities,.ledger-statement){background:transparent;color:var(--fx-ink);transition:color .6s cubic-bezier(.22,1,.36,1)}
body[data-page=home] .intro-copy>p,body[data-page=home] .about-summary p,body[data-page=home] .product-copy p,body[data-page=home] .ledger-capabilities>p{color:var(--fx-ink-2)}
body[data-page=home] .about-title span{color:var(--fx-ink-3)}

/* nav: glass pill over the liquid */
body[data-page=home] .ledger-nav{background:var(--fx-glass);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 0 1px var(--fx-hair),0 10px 30px -12px rgba(16,30,70,.25)}
body[data-page=home] .ledger-logo{color:var(--fx-ink)}

body[data-page=home] .ledger-nav nav a:hover{color:var(--fx-ink)}

/* buttons keep their look in light, invert in the dark chapters so they never vanish */
body[data-page=home] .ledger-button.secondary{background:rgba(16,16,16,.07);color:var(--fx-ink);box-shadow:inset 0 0 0 1px var(--fx-hair)}
body[data-page=home] .ledger-button.secondary:hover{background:rgba(16,16,16,.13)}
body[data-page=home].dark .ledger-button:not(.secondary){background:#f5f5f7;color:#101010}
body[data-page=home].dark .ledger-button:not(.secondary):hover{background:#245eea;color:#fff}
body[data-page=home].dark .ledger-button.secondary{background:rgba(255,255,255,.12)}
body[data-page=home].dark .ledger-button.secondary:hover{background:rgba(255,255,255,.2)}

/* footer: translucent instead of a white slab */
body[data-page=home] .ledger-footer{background:rgba(255,255,255,.5);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--fx-hair)}
body[data-page=home] .footer-top p,body[data-page=home] .footer-top>div:not(:first-child){color:var(--fx-ink-2)}
body[data-page=home] .ledger-footer .footer-bottom{border-top-color:var(--fx-hair);color:var(--fx-ink-3)}

@media(prefers-reduced-transparency:reduce){body[data-page=home] .ledger-nav{background:#fff;-webkit-backdrop-filter:none;backdrop-filter:none}body[data-page=home] .ledger-footer{background:#fff}}

/* headings break evenly instead of leaving one word alone on a line (e.g. "fisco" on phones) */
body[data-page=home] :is(h1,h2){text-wrap:balance}
