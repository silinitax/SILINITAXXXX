/* SiliniTax palette and simplified navigation */
:root{--navy:#0B1F45;--blue:#2F66FF;--blue-deep:#173A79;--cream:#FFFFFF;--ink:#0B1F45;--muted:#173A79;--line:#DCE7F5;--yellow:#8FAEFF;--white:#FFFFFF}
body{background:#FFFFFF}
.inner-cta{background:#EAF1FF}
.plan.featured{background:#173A79;border-color:#173A79}
.plan.featured p{color:#EAF1FF}

/* Brand adaptation of the supplied glow button, used only for the two named CTAs. */

/* Mobile hero: editorial type and the phone share one layered composition. */

/* The same phone travels from the hero into the feature story. */

/* The hero stays pinned while its content changes with scroll. */
body[data-page="home"]{--hero-header-height:90px}
@media(max-width:760px){
  body[data-page="home"]{--hero-header-height:72px}
}

/* 2026-10 refinements (impeccable clarify + harden): the nav stays reachable while scrolling,
   contact buttons carry the WhatsApp glyph. */
.ledger-nav{position:fixed}

@media(max-width:760px){.btn-icon{width:17px;height:17px}.ledger-nav .ledger-button.has-icon{gap:7px}}
/* Home: liquid background instead of the blue grid stage and the coin/receipt photo.
   The page sits on one fixed WebGL canvas; .dark (set while the studio or product chapter is centred)
   turns both the canvas and every text token navy-dark, so headings stay readable during the change. */
body[data-page=home]{--fx-ink:#101010;--fx-ink-2:#3a3a41;--fx-ink-3:#56565d;--fx-hair:rgba(16,16,16,.1);--fx-glass:rgba(255,255,255,.62);--fx-film:rgba(241,241,241,.88);background:#f1f1f1;color:var(--fx-ink);transition:color .6s cubic-bezier(.22,1,.36,1)}
body[data-page=home].dark{--fx-ink:#f5f5f7;--fx-ink-2:#d2d2d7;--fx-ink-3:#a1a1a6;--fx-hair:rgba(255,255,255,.14);--fx-glass:rgba(22,27,46,.55);--fx-film:rgba(7,11,30,.5)}
body[data-page=home].no-fluid{background:linear-gradient(160deg,#eef3fb,#dbe7ff 60%,#efe8ff) fixed}
body[data-page=home].no-fluid.dark{background:#070d22}
#fluid{position:fixed;inset:0;width:100%;height:100%;z-index:-1;display:block;pointer-events:none}
::selection{background:#245eea;color:#fff}

/* surfaces become transparent so the liquid shows through */
body[data-page=home] :is(.ledger-intro,.ledger-journey,.ledger-about,.ledger-platform,.ledger-product,.ledger-capabilities,.ledger-statement){background:transparent;color:var(--fx-ink);transition:color .6s cubic-bezier(.22,1,.36,1)}
body[data-page=home] .intro-copy>p,body[data-page=home] .about-summary p,body[data-page=home] .product-copy p,body[data-page=home] .ledger-capabilities>p{color:var(--fx-ink-2)}
body[data-page=home] .about-title span{color:var(--fx-ink-3)}

/* nav: glass pill over the liquid */
body[data-page=home] .ledger-nav{background:var(--fx-glass);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 0 1px var(--fx-hair),0 10px 30px -12px rgba(16,30,70,.25)}
body[data-page=home] .ledger-logo{color:var(--fx-ink)}
body[data-page=home] .ledger-nav nav a{color:var(--fx-ink-2)}
body[data-page=home] .ledger-nav nav a:hover{color:var(--fx-ink)}

/* buttons keep their look in light, invert in the dark chapters so they never vanish */
body[data-page=home] .ledger-button.secondary{background:rgba(16,16,16,.07);color:var(--fx-ink);box-shadow:inset 0 0 0 1px var(--fx-hair)}
body[data-page=home] .ledger-button.secondary:hover{background:rgba(16,16,16,.13)}
body[data-page=home].dark .ledger-button:not(.secondary){background:#f5f5f7;color:#101010}
body[data-page=home].dark .ledger-button:not(.secondary):hover{background:#245eea;color:#fff}
body[data-page=home].dark .ledger-button.secondary{background:rgba(255,255,255,.12)}
body[data-page=home].dark .ledger-button.secondary:hover{background:rgba(255,255,255,.2)}

/* footer: closes the light film, a touch brighter */
body[data-page=home] .ledger-footer{position:relative;background:rgba(246,246,247,.95);border-top:1px solid var(--fx-hair)}
body[data-page=home] .footer-top p,body[data-page=home] .footer-top>div:not(:first-child){color:var(--fx-ink-2)}
body[data-page=home] .ledger-footer .footer-bottom{border-top-color:var(--fx-hair);color:var(--fx-ink-3)}

@media(prefers-reduced-transparency:reduce){body[data-page=home] .ledger-nav{background:#fff;-webkit-backdrop-filter:none;backdrop-filter:none}body[data-page=home] .ledger-footer{background:#fff}}

/* headings break evenly instead of leaving one word alone on a line (e.g. "fisco" on phones) */
body[data-page=home] :is(h1,h2){text-wrap:balance}

/* type: display tracking stops at -0.04em so letters no longer touch */
body[data-page=home] main :is(h1,h2){letter-spacing:-.04em}

/* the deck section lost its kicker column: deck + heading only, the pair centred */
@media(min-width:761px){
  body[data-page=home] .platform-stage{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  body[data-page=home] .feature-deck{width:min(470px,100%);justify-self:end}
}

/* "Meno dubbi. Più chiarezza.": how the studio works with you, no second phone */
body[data-page=home] .ledger-product{padding:clamp(96px,11vw,150px) 6.25%}

/* closing: email stays one tap away from the WhatsApp button */
body[data-page=home] .statement-alt{margin-top:18px;font-size:15px;color:var(--fx-ink-2)}
body[data-page=home] .statement-alt a{color:var(--fx-ink);text-decoration:underline;text-underline-offset:3px}

@media(max-width:760px){
  body[data-page=home] .platform-stage>h2{grid-row:1}

  body[data-page=home] .product-layout{grid-template-columns:1fr;gap:44px}
